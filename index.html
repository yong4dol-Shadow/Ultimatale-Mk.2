<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shadow the Hedgehog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="320" height="240"></canvas>

    <div id="boot">
      <h1>SHADOW<span>THE HEDGEHOG</span></h1>
      <p id="bootmsg">에셋 생성 중...</p>
    </div>

    <div id="hint">
      <b>이동</b> 방향키 / WASD &nbsp;·&nbsp;
      <b>확인</b> Z, Enter &nbsp;·&nbsp;
      <b>취소 / 대시</b> X &nbsp;·&nbsp;
      <b>메뉴</b> C &nbsp;·&nbsp;
      <b>전체화면</b> F &nbsp;·&nbsp;
      <b>음소거</b> M
    </div>
  </div>

  <!-- generated artwork (base64 sheets) -->
  <script src="js/sprite_data.js"></script>
  <!-- optional: drop in your own sheets, see README (safe to 404) -->
  <script src="js/sprite_override.js" onerror="void 0"></script>

  <!-- engine layer -->
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/dialogue.js"></script>

  <!-- content -->
  <script src="js/data_maps.js"></script>
  <script src="js/data_enemies.js"></script>

  <!-- gameplay systems -->
  <script src="story_branch.js"></script>
  <script src="combat.js"></script>
  <script src="overworld.js"></script>
  <script src="main.js"></script>
</body>
</html>
